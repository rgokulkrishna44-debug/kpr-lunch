<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F1EB">
<title>KPR Lunch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Palette: Alabaster #F4F1EB, Dark Slate Green #2D5A4A, Moss Green #7BA05B, Dark Jungle Green #0D4C3C */
:root{
  color-scheme:light;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --bg:#F4F1EB;--s1:#FCFBF8;--s2:#E7E3D8;--s3:#9DAA9F;--mute:#5C6E64;--text:#0D4C3C;--hi:#082F25;--slate:#2D5A4A;--moss:#7BA05B;
  --line:rgba(13,76,60,.12);--line2:rgba(13,76,60,.22);
  --ok:#3E6B2F;--okbg:rgba(123,160,91,.18);--okln:rgba(123,160,91,.5);
  --warn:#8A5A12;--warnf:#D9A441;--warnbg:rgba(217,164,65,.16);--warnln:rgba(217,164,65,.5);
  --bad:#A63A32;--badbg:rgba(190,70,60,.09);--badln:rgba(190,70,60,.32);
  --r:22px;
  --font:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body:has(.dash){padding-bottom:0}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,input,label{touch-action:manipulation}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--text);font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased;padding-bottom:calc(120px + var(--sab));
  background:radial-gradient(1100px 560px at 50% -220px,rgba(123,160,91,.22),rgba(123,160,91,.08) 42%,transparent 72%) no-repeat,var(--bg)}
::selection{background:var(--text);color:var(--bg)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3{margin:0;color:var(--hi);letter-spacing:-.025em;font-weight:650}
.mute{color:var(--mute)}.small{font-size:13px}.center{text-align:center}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.view main{animation:in .3s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
@keyframes fade{from{opacity:0}}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(123,160,91,0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* nav */
.nav{position:sticky;top:0;z-index:40;padding-top:var(--sat);background:rgba(244,241,235,.8);backdrop-filter:saturate(160%) blur(18px);-webkit-backdrop-filter:saturate(160%) blur(18px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1120px;margin:0 auto;padding:0 max(24px,var(--sar)) 0 max(24px,var(--sal));height:62px;display:flex;align-items:center;gap:20px}
.logo{display:flex;align-items:center;gap:10px;font-weight:650;font-size:16px;color:var(--hi);letter-spacing:-.01em;white-space:nowrap}
.mark{width:30px;height:30px;border-radius:10px;background:linear-gradient(160deg,var(--text),var(--mute));color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:14px}
.sp{flex:1}
.navlink{color:var(--mute);font-size:14px;font-weight:500;transition:color .2s;white-space:nowrap}
.navlink:hover,.navlink.on{color:var(--hi)}
.me{display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--line2);color:var(--text);font:600 13px var(--mono);padding:5px 12px 5px 5px;border-radius:99px;transition:border .2s}
.me:hover{border-color:var(--mute)}
.me .rn{white-space:nowrap}
.me i{width:24px;height:24px;border-radius:50%;background:var(--s2);display:grid;place-items:center;font-style:normal}

/* layout */
.page{max-width:1120px;margin:0 auto;padding:0 max(24px,var(--sar)) 0 max(24px,var(--sal))}
.page.mid{max-width:780px}
.page.narrow{max-width:600px}
.hero{padding:56px 0 8px}
.display{font-size:clamp(34px,11vw,68px);line-height:1;letter-spacing:-.05em;font-weight:700}
.eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.09em;text-transform:uppercase;margin:0 0 18px}
.live{width:7px;height:7px;border-radius:50%;background:var(--moss);box-shadow:0 0 0 4px rgba(123,160,91,.25);animation:pulse 2.2s infinite}
.live.off{background:var(--s3);box-shadow:none;animation:none}
.lead{font-size:18px;color:var(--mute);margin:18px 0 0;line-height:1.55;max-width:560px}
.lead b{color:var(--text);font-weight:600}
.lead.sm{font-size:15px;margin-top:6px}
section{margin-top:44px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;margin-bottom:16px;flex-wrap:wrap}
.sec-h h2{font-size:22px;white-space:nowrap}
.sec-h h3{font-size:16px;white-space:nowrap}
.h1{font-size:32px;font-weight:700;letter-spacing:-.035em}
.h1.big{font-size:40px}
.h2{font-size:19px;margin:36px 0 14px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:22px}
.list{padding:2px 22px}
.lbl{display:block;font-size:11.5px;font-weight:600;color:var(--mute);letter-spacing:.08em;text-transform:uppercase;margin:0 0 10px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--text);color:var(--bg);font-weight:600;font-size:15px;padding:12px 22px;border-radius:99px;transition:transform .15s,background .2s,opacity .2s;white-space:nowrap}
.btn:hover{background:var(--hi)}
.btn:active{transform:scale(.98)}
.btn.lg{width:100%;padding:16px 22px;font-size:16px;margin-top:14px}
.btn.sm{padding:8px 15px;font-size:13px}
.btn.ok{background:var(--moss);color:var(--hi)}
.btn.warn{background:var(--warnf);color:var(--hi)}
.btn.ghost{background:var(--s2);color:var(--text)}
/* Log in / Create account switch, same look as the Coz Coffee login */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--s2);border-radius:99px;padding:4px;margin:0 0 20px;max-width:340px}
.seg button{border:0;background:transparent;border-radius:99px;padding:10px 0;font:500 14px var(--font);color:var(--mute);cursor:pointer;transition:background .2s,color .2s}
.seg button.on{background:#fff;color:var(--hi);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.btn.ghost:hover{background:var(--s3);color:var(--hi)}
.btn:disabled{opacity:.3;cursor:not-allowed;transform:none}
.input{width:100%;font:inherit;font-size:17px;color:var(--hi);padding:14px 18px;border:1px solid var(--line2);border-radius:16px;background:#fff;outline:none;transition:border .2s,box-shadow .2s}
.input::placeholder{color:var(--s3)}
.input:focus{border-color:var(--mute);box-shadow:0 0 0 4px rgba(13,76,60,.12)}
.input.bad{border-color:var(--bad)}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:8px 0 0}
.fine{font-size:13px;color:var(--mute);margin:14px 0 0;line-height:1.5}
.fine a,.fine button{color:var(--hi);font-weight:600;text-decoration:underline;text-underline-offset:3px;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 11px;border-radius:99px;background:var(--s2);color:var(--text);white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.bad{background:var(--badbg);color:var(--bad)}
.chip.light{background:var(--text);color:var(--bg)}
.chip.line{background:transparent;border:1px solid var(--line2);color:var(--mute)}
.chip.dk{background:rgba(244,241,235,.14);color:var(--bg)}
.banner{background:var(--warnbg);color:var(--warn);border:1px solid var(--warnln);padding:13px 16px;border-radius:16px;font-size:14px;font-weight:500;margin:18px 0}
.note{background:var(--s1);border:1px solid var(--line);color:var(--mute);padding:15px 18px;border-radius:16px;font-size:14px;margin-top:14px}
.note.warn{background:var(--warnbg);border-color:var(--warnln);color:var(--warn)}
.note.ok{background:var(--okbg);border-color:var(--okln);color:var(--ok)}
.empty{padding:44px 22px;text-align:center;color:var(--mute)}
.tile{width:42px;height:42px;border-radius:14px;display:inline-grid;place-items:center;font:700 17px var(--mono);flex:none;color:var(--hi);background:linear-gradient(160deg,var(--s2),var(--s1));border:1px solid var(--line2)}
.tile.sm{width:34px;height:34px;font-size:14px;border-radius:11px}
.tile.lg{width:54px;height:54px;font-size:21px;border-radius:17px}
.tile.xl{width:84px;height:84px;font-size:34px;border-radius:26px}
.veg{width:14px;height:14px;border:1.5px solid #2F8F4E;border-radius:3px;display:inline-grid;place-items:center;flex:none}
.veg::after{content:"";width:6px;height:6px;border-radius:50%;background:#2F8F4E}
.veg.nv{border-color:#C0392B}.veg.nv::after{background:#C0392B}
.foot{margin:64px 0 0;padding:26px 0;border-top:1px solid var(--line);font-size:14px;color:var(--mute);display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.foot a{color:var(--hi);font-weight:600}

/* landing */
.land{display:grid;grid-template-columns:1.05fr .95fr;gap:64px;align-items:center;padding:56px 0 24px;min-height:calc(100vh - 190px)}
.signin{margin-top:34px;max-width:460px}
.row2{display:flex;gap:10px}
.row2 .input{flex:1;min-width:0}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:34px;max-width:520px}
.steps div{border-top:1px solid var(--line2);padding-top:12px;font-size:14px;color:var(--text);line-height:1.4}
.steps span{display:block;font-size:11px;color:var(--mute);margin-bottom:6px;letter-spacing:.06em}
.stack{position:relative;filter:drop-shadow(0 30px 60px rgba(8,47,37,.18))}
.pillx{position:relative;height:104px;border-radius:999px;margin-top:-38px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:22px 38px;border:1px solid rgba(13,76,60,.1);box-shadow:0 -16px 34px rgba(8,47,37,.12);animation:up .7s cubic-bezier(.2,.8,.2,1) both}
.pillx:first-child{margin-top:0}
.pillx b{display:block;font-size:15px;font-weight:650;letter-spacing:-.01em;line-height:1.25}
.pillx span{display:block;font-size:13px;opacity:.72;margin-top:3px;line-height:1.3}
.pillx em{font:600 12.5px var(--mono);font-style:normal;opacity:.7;padding-top:2px}
.stack-cap{text-align:center;color:var(--mute);font-size:13px;margin:26px 0 0}

/* home */
.daybar{margin-top:34px;max-width:660px}
.db-track{position:relative;height:8px}
.db-fill{position:absolute;inset:0;border-radius:99px;overflow:hidden;background:var(--s1);display:flex}
.db-fill span{height:100%}
.db-now{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--hi);border:4px solid var(--bg);box-shadow:0 0 0 1px var(--line2),0 4px 14px rgba(8,47,37,.1);transition:left .5s cubic-bezier(.2,.8,.2,1)}
.db-labels{position:relative;height:42px;margin-top:12px;font-size:12px;color:var(--mute)}
.db-labels span{position:absolute;transform:translateX(-50%);white-space:nowrap;text-align:center;line-height:1.35}
.db-labels span:first-child{transform:none;text-align:left}
.db-labels span:last-child{transform:translateX(-100%);text-align:right}
.db-labels b{display:block;color:var(--text);font:600 12px var(--mono)}
.tokens{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))}
.live-card{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;background:linear-gradient(160deg,var(--hi),var(--text));color:var(--bg);border-radius:26px;padding:24px 26px;transition:transform .2s;box-shadow:0 20px 50px rgba(8,47,37,.14)}
.live-card:active{transform:scale(.985)}
.lc-top{font-size:13px;font-weight:600;opacity:.6}
.lc-token{font-size:52px;font-weight:600;letter-spacing:.1em;line-height:1.1;margin-top:4px}
.lc-sub{font-size:14px;opacity:.7;margin-top:4px}
.lc-right{display:flex;flex-direction:column;align-items:flex-end;gap:14px}
.lc-go{font-size:14px;font-weight:600;display:flex;align-items:center;gap:4px}
.shops{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.shop{display:block;background:var(--s1);border:1px solid var(--line);border-radius:24px;padding:22px;transition:transform .2s,border-color .2s,background .2s;text-align:left;width:100%}
@media(hover:hover){.shop:hover{border-color:var(--line2);background:#fff}}
.shop:active{transform:scale(.985)}
.shop-top{display:flex;align-items:center;gap:16px}
.shop-b{flex:1;min-width:0}
.shop-n{font-size:19px;font-weight:650;color:var(--hi);letter-spacing:-.015em}
.chev{color:var(--s3);display:flex;transition:transform .2s,color .2s}
.shop:hover .chev{color:var(--text);transform:translateX(3px)}
.shop-sp{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.sp-row{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--text);font-size:15px;font-weight:500}
.sp-row>span:first-child{display:flex;align-items:center;gap:8px}
.shop-f{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* menu */
.backlink{display:inline-flex;align-items:center;gap:6px;color:var(--mute);font-size:14px;font-weight:500;margin:24px 0 0;padding:6px 10px 6px 0;transition:color .2s}
.backlink:hover{color:var(--hi)}
.menu-wrap{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:36px;align-items:start}
.aside{position:sticky;top:calc(86px + var(--sat));margin-top:22px}
.shop-hero{display:flex;gap:22px;align-items:center;margin:20px 0 4px}
.shop-hero>div{min-width:0}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.special{display:flex;justify-content:space-between;align-items:center;gap:16px;background:linear-gradient(135deg,var(--s2),var(--s1) 70%);border:1px solid var(--line2);border-radius:24px;padding:22px 24px;margin-top:24px}
.special .lbl{color:var(--warn);margin-bottom:6px}
.sp-n{font-size:21px;font-weight:650;color:var(--hi);letter-spacing:-.015em;display:flex;align-items:center;gap:10px}
.sp-p{color:var(--mute);margin-top:2px;font-size:15px}
.tools{margin-top:22px;position:relative}
.tools svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--s3)}
.search{font-size:16px;padding:13px 16px 13px 44px}
.cats{position:sticky;top:calc(62px + var(--sat));z-index:30;display:flex;gap:8px;overflow-x:auto;padding:14px 24px;margin:0 -24px;background:linear-gradient(var(--bg) 70%,rgba(244,241,235,0));scrollbar-width:none;overscroll-behavior-x:contain}
.cats::-webkit-scrollbar{display:none}
.cats button{white-space:nowrap;border:1px solid var(--line2);padding:7px 15px;border-radius:99px;font-size:13.5px;font-weight:500;color:var(--mute);background:var(--bg);transition:color .2s,border-color .2s}
.cats button:hover{color:var(--hi);border-color:var(--mute)}
.cat{margin-top:16px}
.cat h3{font-size:13px;margin:0 0 10px 4px;color:var(--mute);text-transform:uppercase;letter-spacing:.09em;font-weight:600}
.it{display:flex;align-items:center;gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.list>.it:first-child{border-top:0}
.it-b{flex:1;min-width:0}
.it-n{font-size:16px;font-weight:500;color:var(--hi);line-height:1.4}
.it-n .veg{vertical-align:-1px;margin-right:9px}
.it-n .best{display:inline-block;vertical-align:2px;margin-left:8px}
.it-p{font-size:14px;color:var(--mute);margin-top:3px;font-variant-numeric:tabular-nums}
.best{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);border:1px solid var(--line2);padding:2px 7px;border-radius:6px}
.best.sp{color:var(--warn);border-color:var(--warnln)}
.add{border:1px solid var(--line2);color:var(--hi);font-weight:600;font-size:14px;padding:8px 20px;border-radius:99px;transition:background .2s,border-color .2s}
.add:hover{background:var(--s2);border-color:var(--mute)}
.add:active,.cats button:active{transform:scale(.96)}
.step button:active{opacity:.55}
.add:disabled{color:var(--s3);border-color:var(--line);background:none;cursor:not-allowed}
.step{display:inline-flex;align-items:center;background:var(--text);color:var(--bg);border-radius:99px;height:36px;flex:none}
.step button{width:36px;height:36px;font-size:18px;font-weight:600;color:var(--bg)}
.step span{min-width:18px;text-align:center;font:700 14px var(--mono)}
.step.sm{height:30px}.step.sm button{width:28px;height:30px;font-size:15px}.step.sm span{font-size:13px;min-width:14px}
.sold{font-size:13px;color:var(--s3);font-weight:600}
.mini{margin:12px 0 4px}
.mini-r{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.mini-r:first-child{border-top:0}
.mini-n{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--hi)}
.mini-n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-p{min-width:58px;text-align:right;font-size:13px;color:var(--text)}
.cartbar{position:fixed;left:0;right:0;bottom:calc(78px + var(--sab));z-index:35;padding:0 max(12px,var(--sar)) 0 max(12px,var(--sal));pointer-events:none;display:none;transition:opacity .2s}
.cartbar-in{pointer-events:auto;max-width:720px;margin:0 auto;width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--text);color:var(--bg);padding:14px 18px;border-radius:20px;font-weight:600;box-shadow:0 16px 40px rgba(8,47,37,.25);animation:up .35s cubic-bezier(.2,.8,.2,1)}
.cb-l{display:flex;align-items:center;gap:10px}
.cb-n{background:var(--bg);color:var(--hi);min-width:26px;height:26px;padding:0 7px;border-radius:9px;display:grid;place-items:center;font:700 13px var(--mono)}
.cb-go{margin-left:14px;opacity:.6}

/* cart */
.cart-h{display:flex;gap:16px;align-items:center;margin:20px 0 22px}
.line-r{display:flex;align-items:center;gap:14px}
.lt{min-width:64px;text-align:right;font:600 14px var(--mono);color:var(--hi)}
.addmore{display:block;padding:15px 0;border-top:1px solid var(--line);color:var(--text);font-weight:600;font-size:14px}
.addmore:hover{color:var(--hi)}
.opts{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.opt{display:flex;gap:14px;text-align:left;background:var(--s1);border:1.5px solid var(--line);border-radius:20px;padding:18px;transition:border-color .2s;width:100%}
.opt:hover{border-color:var(--line2)}
.opt.on{border-color:var(--text)}
.opt:disabled{opacity:.45;cursor:not-allowed}
.radio{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--s3);flex:none;margin-top:2px;transition:border .2s}
.opt.on .radio{border:6px solid var(--text)}
.opt-b b{display:block;font-size:16px;color:var(--hi);font-weight:600}
.opt-b span{display:block;font-size:13px;color:var(--mute);margin-top:4px;line-height:1.5}
.sum{margin-top:16px}
.row{display:flex;justify-content:space-between;font-size:15px;color:var(--mute);padding:4px 0}
.row.tot{font-size:20px;font-weight:650;color:var(--hi);padding-top:12px;margin-top:6px;border-top:1px solid var(--line)}
.others{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:22px}

/* token ticket */
.tk{position:relative;background:linear-gradient(165deg,var(--hi),var(--text));color:var(--bg);border-radius:28px;padding:24px 26px 26px;margin-top:20px;text-align:center;box-shadow:0 24px 60px rgba(8,47,37,.18)}
.tk-top::before,.tk-top::after{content:"";position:absolute;bottom:-13px;width:24px;height:24px;border-radius:50%;background:var(--bg)}
.tk-top::before{left:-38px}.tk-top::after{right:-38px}
.tk.off .tk-top::before{left:-39px}.tk.off .tk-top::after{right:-39px}

<script>//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;

// Unclaimed orders expire when lunch ends; an unclaimed cash order is a strike.
function sweep(){
  if(USE_PHP)return; // the server expires orders
  let ch=false;
  S.orders.forEach(o=>{
    if(isActive(o)&&!isPart(o)&&(o.day<S.day||S.now>LUNCH_END)){
      o.status='expired';ch=true;
      if(o.pay==='cash'){S.strikes[o.roll]=(S.strikes[o.roll]||0)+1;o.strike=true}
    }
  });
  if(ch)save();
}

/* Admin routing: a verified Gmail whose SHA-256 is listed here goes to the shop counter, everyone else stays on the student menu.

   This only picks the page. The counter itself is still protected by the shop PIN. */
const ADMIN_HASH=['17be51821389f5ab29c1cea33e8ef9bdf1b7e0c25ef1826a239450d08da7805c'];
async function isAdminMail(m){
  try{const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(String(m).trim().toLowerCase()));
    return ADMIN_HASH.indexOf(Array.from(new Uint8Array(d)).map(b=>b.toString(16).padStart(2,'0')).join(''))>=0}catch(e){return false}
}
async function otpVerify(){

  g.busy=false;
  if(USE_PHP&&r&&r.ok&&r.step){g.step=r.step;g.ticket=r.ticket;g.secret=r.secret||'';g.uri=r.uri||'';g.tcode='';g.err='';clearInterval(lgTimer);render();setTimeout(()=>{const i=document.getElementById('lgtotp');if(i)i.focus()},50);return}

function padKey(k){
  if(k==='C')ui.pad='';else if(k==='D')ui.pad=ui.pad.slice(0,-1);else if(ui.pad.length<4)ui.pad+=k;
  ui.found=null;
  if(ui.pad.length===4)checkToken();
  render();
}
function checkToken(){
  const o=liveOf(S.auth).filter(o=>o.token===ui.pad).sort((a,b)=>b.id-a.id)[0];
  ui.found={t:ui.pad,o:o?o.id:null};
}
function loadToken(t){ui.pad=t;checkToken();go('shop')}
function giveOf(o){const g=ui.give[o.id];return o.items.map((it,i)=>{const r=it.q-dOf(it);return g&&g[i]!=null?Math.min(r,Math.max(0,g[i])):r})}
function giveAdj(id,i,d){const o=getO(id),g=giveOf(o),r=o.items[i].q-dOf(o.items[i]);g[i]=Math.max(0,Math.min(r,g[i]+d));ui.give[id]=g;render()}
function handOver(id){
  const o=getO(id);if(!o||!isActive(o))return;
  const g=giveOf(o);if(!g.some(x=>x>0))return;
  if(USE_PHP){const d=o.items.map((it,i)=>dOf(it)+g[i]),full=d.every((x,i)=>x>=o.items[i].q);phpShopAct(id,'give',{d}).then(ok=>{if(ok){delete ui.give[id];ui.pad='';ui.found=full?{done:o.token}:{part:id,t:o.token};render()}});return}
  const amt=o.items.reduce((t,it,i)=>t+it.p*g[i],0);
  o.items.forEach((it,i)=>{if(g[i])it.d=dOf(it)+g[i]});
  if(o.pay==='cash')o.cashPaid=(o.cashPaid||0)+amt;
  o.hold=false;
  const full=leftOf(o)===0;
  if(full){o.status='collected';o.doneAt=S.now}
  save();emit({t:'give',id:o.id,d:o.items.map(dOf),paid:o.cashPaid||0,at:S.now});
  delete ui.give[o.id];ui.pad='';ui.found=full?{done:o.token}:{part:o.id,t:o.token};render()
}
function confirmPay(id,v){
  const o=getO(id);if(!o||!checking(o))return;
  if(USE_PHP){if(ui.found&&ui.found.o===o.id){ui.pad='';ui.found=null}phpShopAct(id,'pay',{v},v==='ok'?'Payment confirmed. The student now sees token '+o.token+'.':'Marked not received. The student has been told.');return}
  o.ps=v;o.payAt=S.now;if(v==='ok')o.paid=true;else o.status='cancelled';
  save();emit({t:'pay',id:o.id,v,at:S.now});
  if(ui.found&&ui.found.o===o.id){ui.pad='';ui.found=null}
  ui.toast=v==='ok'?'Payment confirmed. Token '+o.token+' is now live for the student.':'Marked not received. The student has been told.';
  render();
}
function holdOrder(id,v){const o=getO(id);if(!o||!isActive(o))return;if(USE_PHP){if(ui.found&&ui.found.o===o.id){ui.pad='';ui.found=null}phpShopAct(id,'hold',{v});return}o.hold=v;save();emit({t:'hold',id:o.id,v});if(ui.found&&ui.found.o===o.id){ui.pad='';ui.found=null}render()}

document.addEventListener('keydown',e=>{
  // Demo shortcuts: Option or Alt with T opens the demo panel, D hides the bar
  if(e.altKey&&!e.metaKey&&!e.ctrlKey){
    if(e.code==='KeyT'){e.preventDefault();ui.demo=!ui.demo;ui.dockMin=false;render();return}
    if(e.code==='KeyD'){e.preventDefault();ui.dockMin=!ui.dockMin;ui.demo=false;render();return}
  }
  if(e.key==='Escape'&&(ui.demo||ui.sheet)){ui.demo=false;ui.sheet=null;render();return}
  const r=route();
  if(!r.shop||!S.auth||r.name!=='counter'||e.target.tagName==='INPUT'||e.altKey||e.metaKey||e.ctrlKey)return;
  if(/^[0-9]$/.test(e.key))padKey(e.key);
  else if(e.key==='Backspace')padKey('D');
  else if(e.key==='Escape')padKey('C');
});

}

function cartPage(sid){

   <button class="opt ${m==='upi'?'on':''}" onclick="pickPay('${sid}','upi')"><span class="radio"></span><span class="opt-b"><b>GPay to ${s.name}</b><span>Paid straight to <span class="mono" style="display:inline;color:var(--text)">${esc(st.upi)}</span>. Your token shows PAID at the counter. Cancel till ${fmt(CANCEL_UNTIL)} for a full refund.</span></span></button>
   <button class="opt ${m==='cash'?'on':''}" ${blocked?'disabled':''} onclick="pickPay('${sid}','cash')"><span class="radio"></span><span class="opt-b"><b>Pay at the counter</b><span>${blocked?`Paused for you after ${STRIKE_LIMIT} uncollected cash orders. Please use GPay.`:`Pay cash when you collect. ${s.name} starts cooking when you tap I'm coming. Not collected by ${fmt(LUNCH_END)} counts as a no show.`}</span></span></button>

  <button class="btn lg" ${why?'disabled':''} onclick="placeOrder('${sid}')">${m==='upi'?'Pay '+rs(total)+' with GPay':'Place order, pay at counter'}</button></div>
  ${otherHtml}</main>`;
}

function orderPage(id){
  const o=getO(id);
  if(!o||o.roll!==S.roll)return `<main class="page narrow"><div class="card empty" style="margin-top:40px">Order not found.<br><a class="btn" href="#" style="margin-top:18px">Go home</a></div></main>`;
  const s=shopOf(o.shop),a=isActive(o);
  const fin={collected:'Collected. This token has been used.',cancelled:o.ps==='no'?`Payment not received. ${s.name} did not get ${rsp(upiAmt(o))} in their GPay, so this order was cancelled. If money left your account, show that payment in your UPI app at the ${s.name} counter.`:o.paid?'Cancelled. Full refund sent to your GPay.':o.pay==='upi'?`Cancelled. If you had already paid, ${s.name} sends it back to your GPay.`:'Cancelled.',expired:checking(o)?'Lunch ended before the payment was confirmed.':o.pay==='cash'?'Not collected before lunch ended. Counted as a no show.':'Not collected before lunch ended. The plate was sold at the counter, no refund.'}[o.status];
  let act='';
  if(a&&checking(o)){
    act+=`<div class="note warn"><b>Waiting for ${s.name} to confirm your payment.</b><br>They are checking that ${rsp(upiAmt(o))} reached their GPay. Your pickup PIN appears here the moment they confirm. Keep this page open.</div>`;
    if(S.now<=CANCEL_UNTIL&&o.day===S.day)act+=`<button class="btn ghost lg" onclick="cancelOrder(${o.id})">Cancel order</button>`;
  }else if(a){
    if(o.coming)act+=`<div class="note ok">${s.name} knows you are on the way since ${fmt(o.comingAt)}.</div>`;
    else if(S.now>=COMING_FROM)act+=`<button class="btn lg ok" onclick="comingNow(${o.id})">I'm coming</button><p class="fine center">Tap when you leave class. ${o.pay==='cash'?s.name+' starts cooking your order now.':s.name+' moves your order to the top.'}</p>`;
    else act+=`<div class="note">The I'm coming button opens at ${fmt(COMING_FROM)}. Tap it when you leave class${o.pay==='cash'?' so '+s.name+' starts cooking':''}.</div>`;
    if(o.status==='placed'&&!isPart(o)&&S.now<=CANCEL_UNTIL&&o.day===S.day)act+=`<button class="btn ghost lg" onclick="cancelOrder(${o.id})">Cancel order${o.paid?', full refund':''}</button><p class="fine center">You can cancel till ${fmt(CANCEL_UNTIL)}.</p>`;
    else if(o.status==='placed'&&!isPart(o))act+=`<p class="fine center">Cancelling closed at ${fmt(CANCEL_UNTIL)}.</p>`;
  }
  if(a&&o.hold)act=`<div class="note warn">On hold. ${s.name} is still preparing part of your order. Come when it shows Ready. Your token stays valid.</div>`+act;
  if(a&&isPart(o))act=`<div class="note ok">Collected so far: ${o.items.filter(i=>dOf(i)).map(i=>dOf(i)+' x '+esc(i.n)).join(', ')}. Still to collect: ${o.items.filter(i=>i.q>dOf(i)).map(i=>(i.q-dOf(i))+' x '+esc(i.n)).join(', ')}. The same token works till everything is collected.</div>`+act;
  const steps=[['placed','Order placed'],['cooking','Being prepared'],['ready','Ready at the counter'],['collected','Collected']];
  const idx={placed:0,cooking:1,ready:2,collected:3}[o.status];
  const held=o.status==='placed'&&o.pay==='cash'&&!o.coming;
  return `<main class="page narrow"><button class="backlink" onclick="back('')">${ICON.back} Home</button>
  <div class="tk ${a?'':'off'}"><div class="tk-top">${tile(s)}<div><b>${s.name}</b><div class="small">${dayLabel(o.day)} at ${fmt(o.at)}</div></div>${a?`<span class="chip dk">${checking(o)?'Checking GPay':o.pay==='upi'?'Paid by GPay':'Pay '+rs(o.total)+' at counter'}</span>`:stChip(o)}</div>
  <div class="tk-lbl">${a?'Your pickup PIN':'Token'}</div><div class="tk-num">${checking(o)||o.ps==='no'?'····':o.token}</div>
  <div class="tk-sub">${a&&checking(o)?`Your pickup PIN shows here once ${s.name} confirms your payment of ${rsp(upiAmt(o))}.`:a?(o.pay==='upi'&&!isPart(o)&&!o.hold?`Payment confirmed. This is your PIN to collect your order. Say it at the ${s.name} counter. Collect any time till ${fmt(LUNCH_END)}, handed over in about 2 minutes.`:isPart(o)?`Say this number again at the ${s.name} counter for the rest. This token stays open till every item is collected.`:`Say this number at the ${s.name} counter. Collect any time till ${fmt(LUNCH_END)}, handed over in about 2 minutes.`):fin}</div></div>
  ${act}
  ${idx!==undefined?`<div class="card pad tl">${steps.map(([k,l],i)=>`<div class="tl-s ${i<idx?'done':i===idx?'cur':''}"><span class="tl-d"></span><span>${l}${i===0&&held?'<em>Held until you tap I\'m coming</em>':''}</span></div>`).join('')}</div>`:''}
  <div class="card list" style="margin-top:14px">${o.items.map(i=>`<div class="it"><div class="it-b"><div class="it-n">${i.q} x ${esc(i.n)}</div>${dOf(i)?`<div class="it-p">${dOf(i)} of ${i.q} collected</div>`:''}</div><b class="lt">${rs(i.p*i.q)}</b></div>`).join('')}<div class="it tot"><div class="it-b">Total</div><b class="lt">${rs(o.total)}</b></div></div>
  ${!a?`<button class="btn ghost lg" onclick="orderAgain(${o.id})">Order this again</button>`:''}</main>`;
}

function ordersPage(){
  const mine=S.orders.filter(o=>o.roll===S.roll).sort((a,b)=>b.id-a.id);
  const spent=mine.filter(o=>o.status==='collected').reduce((a,o)=>a+o.total,0);
  const days=[...new Set(mine.map(o=>o.day))].sort((a,b)=>b-a);
  const row=o=>{const s=shopOf(o.shop),a=isActive(o);return `<div class="orow">${tile(s)}<div class="orow-b"><a href="#order-${o.id}"><div class="orow-t"><b>${s.name}</b>${a?`<span class="mono small">${checking(o)?'Checking GPay':'Token '+o.token}</span>`:''}<span class="tot">${rs(o.total)}</span></div><div class="mute small clamp" style="margin-top:2px">${itemsText(o)}</div></a><div class="orow-m">${stChip(o)}<span class="mute small">${fmt(o.at)}, ${o.pay==='upi'?'GPay':'Cash'}</span>${a?`<a class="btn sm" href="#order-${o.id}">View token</a>`:`<button class="btn sm ghost" onclick="orderAgain(${o.id})">Order again</button>`}</div></div></div>`};
  return `<main class="page mid"><section class="hero" style="padding-bottom:0"><p class="eyebrow">Signed in as ${esc(who())}</p><h1 class="display" style="font-size:clamp(36px,5vw,52px)">My orders</h1>

  ${mine.length?days.map(d=>`<section style="margin-top:36px"><div class="sec-h"><h2>${dayLabel(d)}</h2></div><div class="olist">${mine.filter(o=>o.day===d).map(row).join('')}</div></section>`).join(''):`<div class="card empty" style="margin-top:28px">No orders yet.<br><a class="btn" href="#" style="margin-top:18px">Pick a shop</a></div>`}</main>`;

function upiLink(s,amt,roll){return 'upi://pay?pa='+encodeURIComponent(S.shops[s.id].upi).replace('%40','@')+'&pn='+encodeURIComponent(s.name)+'&am='+Number(amt).toFixed(2)+'&cu=INR&tn='+encodeURIComponent('KPR Lunch '+(roll||''))}
function upiQr(str){try{const q=qrcode(0,'M');q.addData(str);q.make();return q.createSvgTag({cellSize:4,margin:0,scalable:true})}catch(e){return ''}}

function sheetHtml(){

    <div class="amt">${rsp(amt)}</div><p class="center mute small" style="margin:0">${plural(n,'item')} from ${s.name}, ${rs(base)} plus ${ui.sheet.paise||0} paise so ${s.name} can match your payment</p>
    <div class="qrbox"><div class="qr">${upiQr(upiLink(s,amt,S.roll))}</div><div class="mute small center">Scan with GPay or any UPI app. Pay exactly ${rsp(amt)}.</div><a class="btn lg ghost upi-open" href="${esc(upiLink(s,amt,S.roll))}">Open GPay on this phone</a></div>
    <button class="btn lg ok" onclick="createOrder('${s.id}',true)">I have paid ${rsp(amt)}</button>
    <p class="fine center">${s.name} checks that ${rsp(amt)} reached their GPay, then your token goes live. Screenshots are not accepted at the counter. Demo: the UPI ID is a placeholder, do not pay it.</p>`;
  }else if(ui.sheet.type==='receipt'){

  }else{

    <div class="acc"><div class="lbl" style="margin:0">Name</div><div class="acc-r">${esc(S.name)}</div></div>

    <div class="acc"><div class="lbl" style="margin:0">Gmail</div><div class="acc-r">${esc(S.email)}</div></div>
    <div class="kv"><span>Orders placed</span><b class="mono">${n}</b></div>

/* ---------- shop views ---------- */
function shopPick(){
  return `<header class="nav"><div class="nav-in"><a class="logo" href="#"><span class="mark">K</span>KPR Lunch</a><span class="sp"></span></div></header>
  <main class="page mid"><section class="hero"><p class="eyebrow">For shops</p><h1 class="display" style="font-size:clamp(36px,5vw,52px)">Open a counter</h1>
  <p class="lead sm">Pick a shop to open its counter. In the live version each shop signs in once with its own PIN and the device opens straight to that counter.</p></section>
  <div class="pick">${SHOPS.filter(s=>!USE_PHP||!S.scope||S.scope==='*'||S.scope===s.id).map(s=>`<button class="shop" onclick="viewAs('${s.id}')"><div class="shop-top">${tile(s,'lg')}<div class="shop-b"><div class="shop-n">${s.name}</div><div class="mute small">${s.tag}</div></div><span class="chev">${ICON.chev}</span></div></button>`).join('')}</div></main>`;
}
function kpis(){
  const t=liveOf(S.auth),act=t.filter(isActive),col=t.filter(o=>o.status==='collected');
  return `<div class="kpis"><div class="kpi"><span>Active orders</span><b>${act.length}</b></div><div class="kpi"><span>GPay to check</span><b>${act.filter(checking).length}</b></div>
  <div class="kpi"><span>Cash to collect</span><b>${rs(act.filter(o=>o.pay==='cash').reduce((a,o)=>a+o.total-(o.cashPaid||0),0))}</b></div>
  <div class="kpi"><span>Handed over</span><b>${col.length}</b><small>${rs(col.reduce((a,o)=>a+o.total,0))} today</small></div></div>`;
}
function resultHtml(){
  const f=ui.found;
  const bad=(t,d)=>`<div class="result bad"><div class="r-big">${t}</div><p style="margin:0">${d}</p></div>`;
  if(!f)return `<div class="result idle"><b>Waiting for a token</b><p>Ask the student for their 4 digit token. PAID or the cash amount shows here straight away.</p></div>`;
  if(f.done)return `<div class="result done"><div class="r-lbl mute">Token ${f.done}</div><div class="r-big">Handed over</div><p class="mute" style="margin:0">This token is now used and cannot be used again.</p></div>`;
  if(f.part){const q=getO(f.part);return `<div class="result done"><div class="r-lbl mute">Token ${f.t}</div><div class="r-big">Part handed over</div><p class="mute" style="margin:0">Still to collect: ${q?itemsText(q):''}. The same token works till everything is collected.</p></div>`}
  const o=f.o&&getO(f.o);
  if(!o)return bad('No order with token '+esc(f.t),'There is no open order with this number at this shop. Check the number with the student.');
  if(o.status==='collected')return bad('Already used','Token '+o.token+' was fully handed over at '+fmt(o.doneAt)+'.');
  if(o.status==='cancelled')return bad('Cancelled','The student cancelled this order'+(o.paid?' and was refunded':'')+'.');
  if(o.status==='expired')return bad('Expired','Lunch ended before this order was collected.');
  if(checking(o))return `<div class="result cash"><div class="r-lbl">Token ${o.token}, ${esc(o.roll)}</div><div class="r-big">GPay NOT CONFIRMED</div><p style="margin:0 0 16px">Open your GPay and look for exactly <b class="mono">${rsp(upiAmt(o))}</b> from ${esc(o.roll)}. Do not hand over food until you confirm it. Never accept a screenshot.</p><div class="r-acts"><button class="btn lg ok" onclick="confirmPay(${o.id},'ok')">${rsp(upiAmt(o))} received</button><button class="btn ghost lg" onclick="confirmPay(${o.id},'no')">Not received, cancel order</button></div></div>`;
  const paid=o.pay==='upi',g=giveOf(o),sel=g.reduce((a,b)=>a+b,0),amt=o.items.reduce((t,it,i)=>t+it.p*g[i],0),rest=leftOf(o)-sel,multi=leftOf(o)>1;
  const rows=o.items.map((it,i)=>{const r=it.q-dOf(it);if(!r)return '';return multi?`<li class="gv"><span><b>${g[i]}</b>of ${r} ${esc(it.n)}</span><div class="step sm"><button aria-label="Give one less" onclick="giveAdj(${o.id},${i},-1)">−</button><span>${g[i]}</span><button aria-label="Give one more" onclick="giveAdj(${o.id},${i},1)">+</button></div></li>`:`<li><b>${r}</b>${esc(it.n)}</li>`}).join('');
  const note=(o.hold?'<div class="r-note"><b>On hold.</b> Part of this order is not ready yet. The student waits or comes back, same token.</div>':'')+(isPart(o)?'<div class="r-note">Partly collected earlier. This is what is still owed.</div>':'')+(multi?'<div class="r-note">Set how many of each item you hand over now. Whatever is left stays open on the same token.</div>':'');
  return `<div class="result ${paid?'paid':'cash'}"><div class="r-lbl">Token ${o.token}, ${esc(o.roll)}</div><div class="r-big">${paid?'PAID by GPay':sel?'COLLECT '+rs(amt)+' CASH':'Nothing selected'}</div>
  ${note}<ul class="r-items">${rows}</ul><div class="r-st" style="margin-bottom:14px">Status ${stChip(o)}${o.coming?'<span class="chip ok">On the way</span>':''}</div>
  <div class="r-acts"><button class="btn lg ${paid?'ok':'warn'}" ${sel?'':'disabled'} onclick="handOver(${o.id})">${rest>0?'Hand over '+sel+' now, '+rest+' later':paid?'Hand over':'Cash received, hand over'}</button>
  ${o.hold?`<button class="btn ghost lg" onclick="advance(${o.id},'ready')">Fully ready, take off hold</button>`:`<button class="btn ghost lg" onclick="holdOrder(${o.id},true)">Put on hold, not fully ready</button>`}</div></div>`;
}
function checkCard(){
  const l=toCheck(S.auth);
  if(!l.length)return '';
  return `<div class="card pad paycheck"><div class="sec-h"><h3>Check GPay payments</h3><span class="chip warn mono">${l.length}</span></div><p class="mute small" style="margin:0 0 6px">Open your GPay or PhonePe Business app. Tap Received only if that exact amount arrived. The student gets their token after you confirm.</p>${l.map(o=>`<div class="pc"><div class="pc-b"><div class="pc-amt mono">${rsp(upiAmt(o))}</div><div class="mute small"><span class="mono">${esc(o.roll)}</span>, ${fmt(o.at)}, ${itemsText(o)}</div></div><div class="pc-a"><button class="btn sm ok" onclick="confirmPay(${o.id},'ok')">Received</button><button class="btn sm ghost" onclick="confirmPay(${o.id},'no')">Not received</button></div></div>`).join('')}</div>`;
}
function waitCard(){
  const w=liveOf(S.auth).filter(o=>isActive(o)&&(o.hold||isPart(o))).sort((a,b)=>a.id-b.id);
  if(!w.length)return '';
  return `<div class="card pad"><div class="sec-h"><h3>Waiting for the rest</h3><span class="mute small mono">${w.length}</span></div>${w.map(o=>`<button class="ow" onclick="loadToken('${o.token}')"><span class="mono">${o.token}</span><span class="ow-b">${itemsText(o)}</span>${stChip(o)}</button>`).join('')}</div>`;
}
function counterView(){
  const onway=liveOf(S.auth).filter(o=>isActive(o)&&o.coming&&!o.hold).sort((a,b)=>a.comingAt-b.comingAt||a.id-b.id);
  const keys=['1','2','3','4','5','6','7','8','9','C','0','D'];
  return `${kpis()}<div class="counter"><div class="card pad"><div class="lbl">Token number</div>
  <div class="tbox">${[0,1,2,3].map(i=>`<span class="${ui.pad[i]?'on':i===ui.pad.length?'cur':''}">${ui.pad[i]||''}</span>`).join('')}</div>

function kitchenView(){

/* ---------- counter billing ---------- */
// Prices on the menu include GST (5% for restaurants: CGST 2.5% + SGST 2.5%). Bills split the tax back out.
const GST_DEMO={s1:'33ABCDE1234F1Z5',s2:'33PQRSX5678K1Z2'};
const PLACE='KPR Institute of Engineering and Technology, Arasur, Coimbatore';
const GSTIN_RE=/^\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/;
const gstinOf = sid => {const v=S.shops[sid]&&S.shops[sid].gstin;return v===undefined?GST_DEMO[sid]||'':v};
const sum = (a,f) => a.reduce((t,x)=>t+f(x),0);
const billsOf = (sid,day) => (S.bills||[]).filter(b=>b.sid===sid&&(day===undefined||b.day===day));
const billOf = id => (S.bills||[]).find(b=>b.id===+id);
function tax(total){const t=Math.round(total*100),g=Math.round(t-t/1.05),c=Math.floor(g/2);return {taxable:(t-g)/100,cgst:c/100,sgst:(g-c)/100,gst:g/100}}
const shopIni = s => s.name.split(' ').map(w=>w[0]).join('').toUpperCase();
function billNo(sid,n){return shopIni(shopOf(sid))+'/26-27/'+String(n||billsOf(sid).length+1).padStart(4,'0')}
const billDate = day => new Date(Date.now()+(day-S.day)*864e5).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const draft = () => ui.bill[S.auth]||(ui.bill[S.auth]={});
function draftLines(){const s=shopOf(S.auth),d=draft();return Object.keys(d).map(id=>{const it=itemOf(s,id);return it?{id,n:it.name,p:it.price,q:d[id],veg:it.veg}:null}).filter(Boolean)}
const draftTotal = () => sum(draftLines(),l=>l.p*l.q);
function bAdd(id,d){const x=draft();x[id]=Math.max(0,(x[id]||0)+d);if(!x[id])delete x[id];render()}
function bClear(){ui.bill[S.auth]={};ui.bgot='';render()}
function bMode(m){ui.bmode=m;render()}
function bFilter(v){ui.bq=v;const q=v.trim().toLowerCase();let any=false;document.querySelectorAll('.bt').forEach(t=>{const ok=!q||t.dataset.n.includes(q);t.style.display=ok?'':'none';if(ok)any=true});const e=document.getElementById('bnone');if(e)e.style.display=any?'none':''}
function chgHtml(total){const got=parseInt(ui.bgot)||0;if(!got)return '<span class="mute">Type the cash given, or tap Exact</span>';if(got<total)return `<span class="bad">${rs(total-got)} short</span>`;return `Return <b class="mono">${rs(got-total)}</b>`}
function bGotIn(v){ui.bgot=v.replace(/\D/g,'').slice(0,6);const t=draftTotal(),g=parseInt(ui.bgot)||0;document.getElementById('chg').innerHTML=chgHtml(t);document.getElementById('bsave').disabled=!!g&&g<t}
function saveBill(){
  const lines=draftLines();if(!lines.length)return;
  const total=draftTotal(),mode=ui.bmode||'cash',got=mode==='cash'?(parseInt(ui.bgot)||total):total;
  if(mode==='cash'&&got<total)return;
  const g=gstinOf(S.auth),cu=saveCust(total);
  const b={id:newId(),sid:S.auth,no:billNo(S.auth),day:S.day,at:S.now,items:lines.map(l=>({id:l.id,n:l.n,p:l.p,q:l.q})),total,mode,got,gstin:g};
  if(cu){b.cname=cu.name;b.cphone=cu.phone}
  (S.bills=S.bills||[]).push(b);ui.bill[S.auth]={};ui.bgot='';ui.bphone=cu?cu.phone:'';ui.cu={};
  save();emit({t:'bill',b});ui.sheet={type:'receipt',id:b.id};render();
}
function voidBill(id){
  const b=billOf(id);if(!b||b.void)return;
  if(ui.voidArm!==b.id){ui.voidArm=b.id;render();setTimeout(()=>{if(ui.voidArm===b.id){ui.voidArm=null;render()}},3000);return}
  ui.voidArm=null;b.void=true;save();emit({t:'void',id:b.id});ui.toast='Bill '+b.no+' cancelled. It is left out of the day totals.';render();
}
function receiptText(b){
  const s=shopOf(b.sid),t=tax(b.total),L=[];
  L.push('*'+s.name+'*',PLACE);if(b.gstin)L.push('GSTIN '+b.gstin);
  L.push('','Bill '+b.no,billDate(b.day)+', '+fmt(b.at),'');
  b.items.forEach(i=>L.push(i.q+' x '+i.n+'  '+rs(i.p*i.q)));
  L.push('');if(b.gstin)L.push('Taxable value '+rsp(t.taxable),'CGST 2.5% '+rsp(t.cgst),'SGST 2.5% '+rsp(t.sgst));
  L.push('*Total '+rs(b.total)+'*','Paid by '+(b.mode==='cash'?'Cash':'UPI'));if(b.void)L.push('','CANCELLED');
  L.push('','Thank you, visit again');return L.join('\n');
}

/* ---------- n8n backend (n8n.luvias.in, workflow "KPR Lunch Backend") ----------
   Customer contacts and offers are stored on the server, not on the public live sync topic.
   Form posts (no custom headers) so the browser sends them without a CORS preflight.
   Each shop unlocks its customer list with its own PIN, typed once on the shop's device. The PIN is never in this page. */
const API='https://n8n.luvias.in/webhook/kpr-lunch';
const pinOf = sid => {try{return localStorage.getItem('kprlunch_pin_'+sid)||''}catch(e){return ''}};
const STUDENT_LINK='rgokulkrishna44-debug.github.io/kpr-lunch/student.html';
const apiAt={};
function apiPost(path,data){const key=pinOf(data.sid);if(!key)return Promise.resolve(null);return fetch(API+'/'+path,{method:'POST',body:new URLSearchParams(Object.assign({key},data))}).then(r=>r.json()).catch(()=>null)}
function pushCust(c){
  if(!pinOf(c.sid)){ui.api='pin';return Promise.resolve(null)}
  return apiPost('customer',{sid:c.sid,phone:c.phone,name:c.name,year:c.year||'',ok:String(!!c.ok),visits:c.visits,spent:c.spent,first:c.first,last:c.last}).then(r=>{
    if(r&&r.tk){const x=custBy(c.sid,c.phone);if(x&&(x.tk!==r.tk||x.stopped!==r.stopped)){x.tk=r.tk;x.stopped=!!r.stopped;save()}}
    ui.api=r&&r.ok?'ok':r&&r.message?'bad':'off';return r});
}
async function pullCusts(sid,force){
  if(!force&&Date.now()-(apiAt[sid]||0)<15000)return;apiAt[sid]=Date.now();
  const key=pinOf(sid);if(!key){if(ui.api!=='pin'){ui.api='pin';render()}return}
  let r;try{r=await fetch(API+'/customers?sid='+sid+'&key='+encodeURIComponent(key)).then(x=>x.json())}catch(e){r=null}
  if(!r||!Array.isArray(r.customers)){const st=r&&r.message?'bad':'off';if(ui.api!==st){ui.api=st;render()}return}
  let ch=ui.api!=='ok';ui.api='ok';
  r.customers.forEach(v=>{const ex=custBy(sid,v.phone);
    if(!ex){upsertCust({id:newId(),sid,phone:v.phone,name:v.name,year:v.year,ok:v.ok,stopped:v.stopped,tk:v.tk,visits:v.visits,spent:v.spent,first:v.first,last:v.last});ch=true;return}
    if(ex.tk!==v.tk||!!ex.stopped!==v.stopped){ex.tk=v.tk;ex.stopped=v.stopped;ch=true}
    if(v.visits>ex.visits){Object.assign(ex,{name:v.name,year:v.year,ok:v.ok,visits:v.visits,spent:v.spent,last:v.last});ch=true}});
  if(ch){save();render()}
}
// Shop types its PIN once; then anything saved on this device before is sent up.
async function setPin(sid){
  const el=document.getElementById('pin'),v=(el&&el.value||'').replace(/\D/g,'');if(!v)return;
  try{localStorage.setItem('kprlunch_pin_'+sid,v)}catch(e){}
  ui.api='wait';render();await pullCusts(sid,true);
  if(ui.api==='bad'){try{localStorage.removeItem('kprlunch_pin_'+sid)}catch(e){};ui.toast='That PIN is not right for '+shopOf(sid).name+'.';render();return}
  const todo=custsOf(sid).filter(c=>!c.tk);for(const c of todo)await pushCust(c);
  ui.toast='Customer list unlocked on this device.';render();
}
function forgetPin(sid){try{localStorage.removeItem('kprlunch_pin_'+sid)}catch(e){};ui.api='pin';S.custs=(S.custs||[]).filter(c=>c.sid!==sid);save();render()}
const pinCard = sid => `<div class="card pad" style="margin-bottom:18px"><div class="sec-h" style="margin-bottom:6px"><h3>${ui.api==='bad'?'PIN not accepted':'Unlock your customer list'}</h3></div>
  <p class="mute small" style="margin:0 0 12px">Student names and numbers are kept on the KPR Lunch server. Type ${esc(shopOf(sid).name)}'s shop PIN once on this device to see them and send offers.</p>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><input id="pin" class="input mono" style="flex:1;min-width:160px" inputmode="numeric" autocomplete="off" placeholder="8 digit PIN" onkeydown="if(event.key==='Enter')setPin('${sid}')"><button class="btn ok" style="width:auto;padding:0 22px" onclick="setPin('${sid}')">Unlock</button></div></div>`;
const stopLink = c => c&&c.tk?API+'/stop?s='+c.sid+'&t='+c.tk:'';
const offDefault = sid => `hi {name}, ${shopOf(sid).name.toLowerCase()} here.
today only, any ${sid==='s1'?'biryani':'fried rice'} comes with a free ${sid==='s1'?'tea':'rose milk'}.
just show this message at the counter before 1:45 pm.
want to skip the queue? order from class on the kpr lunch app: ${STUDENT_LINK}`;

const YEARS=['1st year','2nd year','3rd year','4th year','Staff'];
const custsOf = sid => (S.custs||[]).filter(c=>c.sid===sid);
const custBy = (sid,ph) => (S.custs||[]).find(c=>c.sid===sid&&c.phone===ph);
const cleanPh = v => String(v||'').replace(/\D/g,'').slice(-10);
const fmtPh = p => p.slice(0,5)+' '+p.slice(5);
function upsertCust(c){

// Called from saveBill: returns the phone saved on the bill, or ''
function saveCust(total){
  const c=ui.cu,p=cleanPh(c.phone);if(p.length!==10)return null;
  const ex=custBy(S.auth,p);
  const rec={id:ex?ex.id:newId(),sid:S.auth,phone:p,name:(c.name||'').trim()||(ex&&ex.name)||'Customer',year:c.year||(ex&&ex.year)||'',ok:c.ok!==false,first:ex?ex.first:S.day,last:S.day,visits:(ex?ex.visits:0)+1,spent:(ex?ex.spent:0)+total};
  if(ex){rec.tk=ex.tk;rec.stopped=ex.stopped}upsertCust(rec);pushCust(rec);return rec;
}

function audience(){

function offFile(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  if(ui.off.url)URL.revokeObjectURL(ui.off.url);
  ui.off.file=f;ui.off.url=URL.createObjectURL(f);render();
}
function offClear(){if(ui.off.url)URL.revokeObjectURL(ui.off.url);ui.off.file=null;ui.off.url='';render()}
const offText = c => {const t=(ui.off.msg||'').replace(/\{name\}/g,c?c.name.split(' ')[0]:'there'),l=stopLink(c);return l?t+'\n\ndont want offers from us? tap here and we will stop: '+l:t};
function offSend(){
  const list=audience();if(!list.length||!(ui.off.msg||'').trim())return;
  const camp={id:newId(),sid:S.auth,day:S.day,at:S.now,msg:ui.off.msg,file:ui.off.file?ui.off.file.name:'',to:ui.off.to||'all',n:list.length,sent:[]};
  (S.camps=S.camps||[]).push(camp);save();emit({t:'camp',camp});apiPost('offer',{sid:S.auth,msg:camp.msg,file:camp.file,audience:camp.to,n:camp.n});ui.off.run=camp.id;render();
}
function offMark(cid,ph){const c=(S.camps||[]).find(x=>x.id===cid);if(c&&!c.sent.includes(ph)){c.sent.push(ph);save();emit({t:'campsent',id:cid,ph});setTimeout(render,300)}}
async function offAuto(cid){
  const camp=(S.camps||[]).find(x=>x.id===cid);if(!camp||ui.offbusy)return;
  const list=audience().filter(c=>!camp.sent.includes(c.phone));let ok=0,bad=0;
  for(let i=0;i<list.length;i++){ui.offbusy=(i+1)+' of '+list.length;render();
    const r=await apiPost('wa',{sid:camp.sid,to:list[i].phone,msg:offText(list[i])});
    if(r&&r.ok){ok++;offMark(cid,list[i].phone)}else bad++}
  ui.offbusy=0;ui.toast=ok+' sent'+(bad?', '+bad+' failed':'')+'.';render();
}
async function offShare(){
  const f=ui.off.file;
  try{
    if(f&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],text:offText(null)});return}
    if(navigator.share){await navigator.share({text:offText(null)});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  ui.toast='Sharing a file needs a phone browser. On a laptop, send the message and attach the file in WhatsApp.';render();
}

   <h4>Adjust</h4><div class="g"><button onclick="addNow(-5)">Back 5 min</button><button onclick="addNow(5)">Forward 5 min</button><button onclick="addNow(30)">Forward 30 min</button><button onclick="nextDay()">Next day</button></div>
   <h4>Demo data</h4><div class="g"><button onclick="sampleOrders()">Add sample orders</button><button onclick="resetAll()">${ui.resetArm?'Tap again to clear everything':'Reset demo for everyone'}</button></div>
   <p class="fine">${net.on?'Live: student and shop phones are connected.':'Reconnecting. Changes are kept and sent when the connection returns.'} The clock, sample orders and reset apply to both links. Laptop: Option or Alt with T for this panel, D to hide the bar.</p></div>`:'';
  if(ui.dockMin)return `<button class="dockmini" aria-label="Show demo controls" onclick="ui.dockMin=false;render()"><span class="live ${net.on?'':'off'}"></span>Demo</button>`;
  return `${ui.demo?'<div class="dback" onclick="ui.demo=false;render()"></div>':''}${panel}<div class="dock"><button class="dock-l" aria-label="Hide demo bar" title="Hide demo bar" onclick="ui.dockMin=true;ui.demo=false;render()"><span class="live ${net.on?'':'off'}" title="${net.on?'Live sync on':'Reconnecting'}"></span>Demo${ICON.down}</button><span class="sep"></span><button class="clk ${ui.demo?'on':''}" title="Demo clock and data" onclick="ui.demo=!ui.demo;render()">${hm(S.now)}<span class="ap"> ${S.now>=720?'PM':'AM'}</span></button></div>`;
}

let toastTimer,lastView='';
function renderInner(){
  sweep();
  const r=route();
  let h;
  if(USE_PHP&&S.scope&&S.scope!=='*'&&S.auth!==S.scope)S.auth=S.scope;
  if(r.shop)h=USE_PHP&&(!getTok()||S.role!=='admin')?shopLogin():S.auth?shopDash(r):shopPick();
  else if(!S.roll||!S.email||!S.phone)h=studentLogin();
  else h=studentNav(r)+({home,menu:menuPage,cart:cartPage,order:orderPage,orders:ordersPage}[r.name]||home)(r.arg);
  const key=location.hash+'|'+!!(S.roll&&S.email&&S.phone)+'|'+(S.auth||'');
  document.getElementById('app').innerHTML=`<div class="${key!==lastView?'view':''}">${h}</div>`;
  lastView=key;
  document.getElementById('sheet').innerHTML=sheetHtml();
  document.getElementById('demo').innerHTML=demoHtml();
  if(r.name==='menu')applyFilter();
  if(r.shop&&S.auth&&['customers','billing','analytics','counter'].includes(r.name||'counter'))pullCusts(S.auth);
  if(ui.toast){clearTimeout(toastTimer);toastTimer=setTimeout(()=>{ui.toast='';render()},6000)}
}
function crashScreen(){
  const a=document.getElementById('app');if(!a)return;
  a.innerHTML='<div style="padding:90px 24px;max-width:460px;margin:0 auto;text-align:center"><h1 style="font-size:26px;margin:0 0 10px">One moment, let us reset this screen</h1><p class="fine" style="margin:0 0 22px">Something on this device got out of step. Nothing is lost on the shop side. Reload first. If it still looks wrong, start fresh on this device.</p><button class="btn" onclick="location.reload()">Reload</button> <button class="btn" style="background:transparent;color:inherit;border:1px solid currentColor" onclick="hardReset()">Start fresh on this device</button></div>';
}
function hardReset(){try{localStorage.removeItem(K);localStorage.removeItem(K+'_out')}catch(e){}location.hash='';location.reload()}
function render(){
  try{renderInner();return}catch(e){console.error('render failed, healing',e)}
  try{S=heal(S);save();renderInner();return}catch(e){console.error('render failed again',e)}
  crashScreen();
}
window.addEventListener('error',e=>console.error('page error',e.message));
window.addEventListener('unhandledrejection',e=>{console.error('promise error',e.reason);e.preventDefault()});
const tipEl=document.createElement('div');tipEl.id='tip';document.body.appendChild(tipEl);
function tipAt(e){const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tipEl.style.opacity=0;return}
  tipEl.textContent=t.dataset.tip;const r=tipEl.getBoundingClientRect(),b=t.getBoundingClientRect(),cx=e.clientX||b.left+b.width/2,cy=e.clientY||b.top;
  let x=cx+14,y=cy-r.height-12;if(x+r.width>innerWidth-8)x=cx-r.width-14;if(x<8)x=8;if(y<8)y=cy+18;tipEl.style.transform=`translate(${x}px,${y}px)`;tipEl.style.opacity=1}
document.addEventListener('mousemove',tipAt);document.addEventListener('focusin',tipAt);
document.addEventListener('click',e=>{if(e.target.closest('[data-tip]'))tipAt(e);else tipEl.style.opacity=0});
addEventListener('scroll',()=>tipEl.style.opacity=0,{passive:true});
if(USE_PHP){
  phpClock();
  if(MODE==='student'&&getTok()&&S.role==='admin'&&!S.roll)location.replace('shop.html');
  else phpRestore();
  setInterval(()=>{if(document.hidden)return;if(phpClock())softRender();phpSync()},MODE==='shop'?3000:5000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){phpClock();phpSync()}});
}
render();
connect();
flush();
if(USE_PHP)phpSync();
</script>
